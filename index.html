<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Furai (dawsonpiano)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --text: #f5f5f5;
        --background: #0f1115;
        --primary: #9ca4b0;
        --secondary: #252932;
        --accent: #526b61;
      }
      <!-- autistic ahh colors -->
      html.light {
        --text: #0a0a0a;
        --background: #eaecf0;
        --primary: #4f5763;
        --secondary: #cdd1da;
        --accent: #2d443c;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "JetBrains Mono", "Courier New", Courier, monospace;
        background: var(--background);
        color: var(--text);
        font-size: 15px;
        line-height: 1.7;
        min-height: 100vh;
        display: flex;
        justify-content: center;
      }
      main {
        width: 100%;
        max-width: 640px;
        padding: 48px 24px;
      }
      hr {
        border: none;
        border-top: 1px solid var(--secondary);
        margin: 24px 0;
      }
      h1 {
        font-size: 15px;
        font-weight: 700;
      }
      .tagline {
        color: var(--primary);
      }
      h2 {
        font-size: 15px;
        font-weight: 700;
        margin: 0;
      }
      section { margin: 0; }
      ul {
        list-style: none;
        margin: 0;
      }
      li { margin: 0; }
      a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      a:hover {
        color: var(--text);
        background: var(--secondary);
      }
      .meta {
        color: var(--primary);
        font-style: italic;
        font-size: 13px;
        margin-top: 8px;
      }
      .theme-toggle {
        color: var(--primary);
        font-style: italic;
        font-size: 13px;
        background: none;
        border: none;
        font-family: inherit;
        padding: 0;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .theme-toggle:hover {
        color: var(--text);
        background: var(--secondary);
      }
      .spacer { height: 28px; }
    </style>
  </head>
  <body>
    <main>
      <hr />
      <h1>Furai (dawsonpiano)</h1>
      <p class="tagline">i like computers... i think..</p>

      <div class="spacer"></div>
      <section>
        <h2>code journals</h2>
        <ul>
          <li><a href="#">Oct 2026</a></li>
        </ul>
      </section>

      <div class="spacer"></div>
      <section>
        <h2>music</h2>
        <ul>
          <li><a href="#">piano</a></li>
          <li><a href="#">other stuff</a></li>
        </ul>
      </section>

      <div class="spacer"></div>
      <section>
        <h2>writings</h2>
        <ul>
          <li><a href="#">poems</a></li>
          <li><a href="#">books</a></li>
        </ul>
      </section>

      <div class="spacer"></div>
      <section>
        <h2>contact me</h2>
        <ul>
          <li>mail: <a href="mailto:shadowslaveslave@gmail.com">shadowslaveslave@gmail.com</a></li>
          <li>discord: <a href="#">@dawsonpiano</a></li>
        </ul>
      </section>

      <div class="spacer"></div>
      <p class="meta"><em>last updated: Oct 2026</em></p>
      <hr />

          root.classList.toggle("light");

    </main>
  </body>
</html>
